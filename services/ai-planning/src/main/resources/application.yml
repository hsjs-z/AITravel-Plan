server:
  port: 8084

spring:
  application:
    name: ai-planning
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/travel_ai_planning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info

planning:
  planner: ${PLANNER_PLANNER:mock}
