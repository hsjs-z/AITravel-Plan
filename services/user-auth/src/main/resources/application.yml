server:
  port: 8081

spring:
  application:
    name: user-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

auth:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    ttl-minutes: ${JWT_TTL_MINUTES:1440}
