server:
  port: 8082

spring:
  application:
    name: inventory
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/travel_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:local-placeholder-not-for-calls}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.2
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://127.0.0.1:4318/v1/traces

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

amap:
  web-service-key: ${AMAP_WEB_SERVICE_KEY:}

seed:
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  inventory-horizon-days: ${SEED_INVENTORY_HORIZON_DAYS:365}
  daily-capacity: ${SEED_DAILY_CAPACITY:200}
  amap-min-interval-ms: ${SEED_AMAP_MIN_INTERVAL_MS:250}
